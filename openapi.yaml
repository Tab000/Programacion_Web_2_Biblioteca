openapi: 3.0.3
info:
  title: API REST Biblioteca Universitaria
  description: 'Contrato formal OpenAPI 3.0.3 de la API REST para el Sistema de Biblioteca
    Universitaria.

    Documenta exhaustivamente los 19 modulos del sistema (CRUD completo), los servicios
    de autenticacion

    con JWT (RBAC: Estudiante/Usuario y Bibliotecario/Administrador), métricas de
    caché en memoria y disponibilidad.'
  version: 1.0.0
  contact:
    name: Soporte Plataforma Biblioteca
    email: biblioteca@universidad.edu.co
servers:
- url: http://127.0.0.1:5000
  description: Servidor Local (127.0.0.1:5000)
- url: http://localhost:5000
  description: Servidor Local (localhost:5000)
- url: /
  description: Servidor Relativo Actual
tags:
- name: Autenticación
  description: Endpoints para registro, inicio de sesión y gestión de perfil
- name: Paises
  description: Gestión de países de procedencia y nacionalidades
- name: Idiomas
  description: Catálogo de idiomas de los libros
- name: Editoriales
  description: Gestión de editoriales de libros
- name: Estados Físicos
  description: Catálogo de condiciones físicas de libros
- name: Facultades
  description: Facultades y dependencias universitarias
- name: Tipos de Usuario
  description: Roles y clasificaciones de usuarios (estudiante, docente, etc.)
- name: Turnos
  description: Turnos de trabajo de bibliotecarios
- name: Estados de Reserva
  description: Estados del ciclo de vida de reservas
- name: Estados de Préstamo
  description: Estados del ciclo de vida de préstamos
- name: Ciudades
  description: Catálogo de ciudades de residencia
- name: Categorías
  description: Clasificación temática y áreas del conocimiento
- name: Autores
  description: Autores de obras literarias y académicas
- name: Bibliotecarios
  description: Personal administrativo y gestión de accesos
- name: Libros
  description: Catálogo de libros y control de acervo
- name: Usuarios
  description: Gestión de lectores y estudiantes universitarios
- name: Direcciones
  description: Direcciones de residencia de usuarios
- name: Historial de Ubicaciones
  description: Trazabilidad de estanterías y ubicaciones de libros
- name: Reservas
  description: Control de reservas y cola de espera de libros
- name: Préstamos
  description: Control de préstamos, plazos, renovaciones y multas
- name: Caché
  description: Monitoreo y administración de la caché en memoria
paths:
  /api/auth/registro:
    post:
      tags:
      - Autenticación
      summary: Registrar nuevo usuario/estudiante
      description: Crea una nueva cuenta de estudiante/usuario con contraseña cifrada
        y retorna token JWT.
      operationId: authRegistrarUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroUsuarioRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Datos incompletos o usuario ya existente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/registro-bibliotecario:
    post:
      tags:
      - Autenticación
      summary: Registrar nuevo bibliotecario
      description: Crea un nuevo bibliotecario con privilegios de administración.
      operationId: authRegistrarBibliotecario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroBibliotecarioRequest'
      responses:
        '201':
          description: Bibliotecario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/opciones-registro:
    get:
      tags:
      - Autenticación
      summary: Opciones de catálogo para registro
      description: Obtiene listas de tipos de usuario, facultades y turnos para alimentar
        formularios.
      operationId: authOpcionesRegistro
      responses:
        '200':
          description: Opciones disponibles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpcionesRegistroResponse'
  /api/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión (Estudiante o Bibliotecario)
      description: Valida credenciales por Email o Código y retorna token JWT de acceso.
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login-bibliotecario:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión exclusivo para bibliotecarios
      description: Verifica credenciales asegurando que pertenezcan a la tabla bibliotecario.
      operationId: authLoginBibliotecario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales inválidas o no es bibliotecario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/perfil:
    get:
      tags:
      - Autenticación
      summary: Consultar perfil del usuario autenticado
      description: Retorna información detallada del usuario o bibliotecario a partir
        del token JWT.
      operationId: authPerfil
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/cache/stats:
    get:
      tags:
      - Caché
      summary: Estadísticas y rendimiento del caché
      description: Retorna métricas de aciertos (HIT), fallos (MISS), tasa de efectividad
        y llaves activas.
      operationId: cacheStats
      responses:
        '200':
          description: Métricas del caché
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStats'
  /api/cache/clear:
    post:
      tags:
      - Caché
      summary: Vaciar caché en memoria
      description: Invalida todas las claves cacheadas. Requiere rol de bibliotecario.
      operationId: cacheClear
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Caché vaciado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeRespuesta'
        '400':
          description: Datos inválidos o error de integridad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token no provisto o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Acceso restringido (requiere rol bibliotecario)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
