components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido en /api/auth/login o /api/auth/registro.
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          example: Mensaje de error descriptivo
        detalle:
          type: string
          example: Detalle técnico o restricción violada
        mensaje:
          type: string
          example: Mensaje informativo
    MensajeRespuesta:
      type: object
      properties:
        mensaje:
          type: string
          example: Operación completada exitosamente
    RegistroUsuarioRequest:
      type: object
      required:
      - Codigo_Usuario
      - Nombre_Usuario
      - Email_Usuario
      - Password
      properties:
        Codigo_Usuario:
          type: string
          example: USR_2026_01
        Nombre_Usuario:
          type: string
          example: Carlos Gomez
        Email_Usuario:
          type: string
          format: email
          example: carlos.gomez@correo.edu.co
        Password:
          type: string
          format: password
          example: claveSegura123
        Telefono_Usuario:
          type: string
          example: '3001234567'
        ID_Tipo_Usuario:
          type: integer
          example: 1
        ID_Facultad:
          type: integer
          example: 1
    RegistroBibliotecarioRequest:
      type: object
      required:
      - Codigo_Bibliotecario
      - Nombre_Bibliotecario
      - Email_Bibliotecario
      - Password
      properties:
        Codigo_Bibliotecario:
          type: string
          example: BIB_2026_01
        Nombre_Bibliotecario:
          type: string
          example: Laura Restrepo
        Email_Bibliotecario:
          type: string
          format: email
          example: laura.restrepo@correo.edu.co
        Password:
          type: string
          format: password
          example: adminPass123
        ID_Turno:
          type: integer
          example: 10012
    LoginRequest:
      type: object
      required:
      - Password
      properties:
        identificador:
          type: string
          example: carlos.gomez@correo.edu.co
        Email_Usuario:
          type: string
          example: carlos.gomez@correo.edu.co
        Codigo_Usuario:
          type: string
          example: USR_2026_01
        Password:
          type: string
          format: password
          example: claveSegura123
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tipo_token:
          type: string
          example: Bearer
        rol:
          type: string
          example: usuario
        usuario:
          type: object
        mensaje:
          type: string
          example: Autenticación exitosa
    OpcionesRegistroResponse:
      type: object
      properties:
        tipos_usuario:
          type: array
          items:
            type: object
        facultades:
          type: array
          items:
            type: object
        turnos:
          type: array
          items:
            type: object
    CacheStats:
      type: object
      properties:
        cache_habilitado:
          type: boolean
          example: true
        entradas_activas:
          type: integer
          example: 14
        total_consultas:
          type: integer
          example: 150
        aciertos_hits:
          type: integer
          example: 138
        fallos_misses:
          type: integer
          example: 12
        tasa_aciertos_pct:
          type: number
          example: 92.0
        total_invalidaciones:
          type: integer
          example: 5
        claves_almacenadas:
          type: array
          items:
            type: string
    Pais:
      type: object
      properties:
        ID_Pais:
          type: integer
          readOnly: true
          example: 1
        Nombre_Pais:
          type: string
          example: Colombia
    PaisInput:
      type: object
      properties:
        Nombre_Pais:
          type: string
          example: Colombia
